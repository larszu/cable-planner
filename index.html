<!doctype html>
<!-- `data-cp-shell="app"`: NUR dieser Einstieg ist die Vollbild-Anwendung.
     Sie fuellt das Fenster genau aus und scrollt nicht — die Sperre dagegen
     steht in `src/renderer/index.css` und haengt an dieser Marke.
     `mobile.html` und `viewer.html` teilen sich dasselbe Stilblatt, sind aber
     scrollende SEITEN; ohne die Marke waere ihre Liste nach dem ersten Bild
     zu Ende, und zwar lautlos. -->
<html lang="en" data-cp-shell="app">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <!-- PWA (#877: „Web-Build als installierbare PWA auf iPad nutzbar").
         EIGENE Manifest-Datei und nicht die des Handy-Viewers: die beschreibt
         eine ANDERE App (anderer Name, anderer Einstieg, `mobile.html`). Ein
         Manifest fuer zwei Anwendungen installierte die falsche — wer den
         Editor auf den Homescreen legt, bekaeme den Viewer. -->
    <link rel="manifest" href="editor.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cable Planner" />
    <title>Cable Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
    <script>
      // Derselbe Service-Worker wie fuer Viewer und Handy-Ansicht: er cacht
      // zur Laufzeit, was geholt wurde, und faellt bei einer Navigation auf
      // die gecachte Einstiegsseite zurueck. Ein zweiter waere ein zweiter
      // Cache ueber dieselben Dateien.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
