name: CI

# Der Merge-Gate. Die Standing Directive erlaubt Selbst-Merge nur bei gruenem
# CI — bis hierher gab es auf Pull Requests aber gar keinen Lauf, der gruen
# oder rot werden konnte. Dieser Workflow prueft genau das, was in CLAUDE.md
# als Pflicht vor jedem Push steht:
#
#   npx tsc -p tsconfig.app.json --noEmit   MUSS 0 Errors zeigen
#   npm run lint                            0 Errors (Warnungen sind geduldet)
#   npm test                                vitest
#   npm run build                           main + preload + renderer
#
# Dazu die beiden headless Node-Checks fuer die Live-Kollaboration:
#
#   npm run test:crdt        CRDT-Konvergenz (reine Rechnung, ~0,4 s)
#   npm run test:signaling   Signaling-Relay gegen den echten Server (~2,6 s)
#
# Die standen bis 2026-09-04 nicht hier, mit der Begruendung, sie "erwarten
# einen laufenden Renderer bzw. Netzwerk". Nachgemessen stimmt das fuer diese
# beiden nicht: `test:crdt` ist ein reines Node-Skript ohne jedes IO, und
# `signaling-relay-check.mjs` startet den echten Server selbst und traegt im
# eigenen Kopf "Exit 0 = alle Asserts gruen, Exit 1 = Fehler (CI-tauglich)".
# Kollaboration war damit die am schlechtesten abgesicherte Funktion des
# groessten Repos -- nicht mangels Pruefung, sondern weil die vorhandene nie
# lief.
#
# Seit 2026-09-05 zusaetzlich als eigener Job: `ui:smoke` (siehe unten).
#
# Bewusst NICHT hier: electron-builder (`npm run dist`) — das gehoert zu
# release.yml und braucht Signatur-Material. Ebenso `test:drag`: der braucht
# wirklich einen laufenden Renderer (`dev:renderer`).
#
# Korrektur an derselben Begruendung: sie zaehlte `ui:smoke` mit auf, und das
# war falsch. `ui:smoke` startet die GEBAUTE App (`electron .` gegen `dist/`),
# nicht den Dev-Server. Nachgemessen 2026-09-05: unter `xvfb-run` mit
# installiertem `libsecret-1-0` laeuft er durch. Eine Begruendung, die zwei
# Laeufe zusammenfasst, von denen nur einer sie traegt, haelt den anderen
# jahrelang aus der CI heraus.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Ein zweiter Push auf denselben Branch bricht den vorigen Lauf ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      # keytar (native) braucht beim Kompilieren libsecret; Prebuilds decken
      # nicht jede Node-ABI ab. Gleiche Absicherung wie in pages.yml.
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - run: npm ci
      - name: Type-Check (Renderer)
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: CRDT-Konvergenz
        run: npm run test:crdt
      - name: Signaling-Relay
        run: npm run test:signaling
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # UI-Smoke: startet die gebaute Electron-App headless, oeffnet jedes Top-Menu
  # und meldet ein Menu ohne Eintraege. Mit genau diesem Harness wurde #549
  # gefunden -- und danach lief er bei keinem Merge mehr, weil er in der
  # CI-Begruendung faelschlich mit `test:drag` in einen Topf geworfen war.
  #
  # Eigener Job, weil er `npm run build` und einen X-Server braucht: so
  # verlaengert er den Merge-Gate nicht, sondern laeuft daneben.
  #
  # Warum `libsecret-1-0` (Laufzeit) UND `libsecret-1-dev` (Kompilieren):
  # gemessen bricht der Main-Prozess sonst beim `require('keytar')` mit
  # "libsecret-1.so.0: cannot open shared object file" ab, bevor ein Fenster
  # entsteht -- der Smoke-Lauf meldete dann nur einen 30-Sekunden-Timeout ohne
  # Ursache.
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libsecret-1-0 xvfb
      - run: npm ci
      - name: Build
        run: npm run build
      - name: UI-Smoke (headless)
        run: xvfb-run -a npm run ui:smoke
      - name: Screenshots bei Fehlschlag
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: /tmp/cable-planner-ui-shots
          if-no-files-found: ignore
