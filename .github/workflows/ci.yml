name: CI

# Der Merge-Gate. Die Standing Directive erlaubt Selbst-Merge nur bei gruenem
# CI — bis hierher gab es auf Pull Requests aber gar keinen Lauf, der gruen
# oder rot werden konnte. Dieser Workflow prueft genau das, was in CLAUDE.md
# als Pflicht vor jedem Push steht:
#
#   npx tsc -p tsconfig.app.json --noEmit   MUSS 0 Errors zeigen
#   npm run lint                            0 Errors (Warnungen sind geduldet)
#   npm test                                vitest
#   npm run build                           main + preload + renderer
#
# Dazu die beiden headless Node-Checks fuer die Live-Kollaboration:
#
#   npm run test:crdt        CRDT-Konvergenz (reine Rechnung, ~0,4 s)
#   npm run test:signaling   Signaling-Relay gegen den echten Server (~2,6 s)
#
# Die standen bis 2026-09-04 nicht hier, mit der Begruendung, sie "erwarten
# einen laufenden Renderer bzw. Netzwerk". Nachgemessen stimmt das fuer diese
# beiden nicht: `test:crdt` ist ein reines Node-Skript ohne jedes IO, und
# `signaling-relay-check.mjs` startet den echten Server selbst und traegt im
# eigenen Kopf "Exit 0 = alle Asserts gruen, Exit 1 = Fehler (CI-tauglich)".
# Kollaboration war damit die am schlechtesten abgesicherte Funktion des
# groessten Repos -- nicht mangels Pruefung, sondern weil die vorhandene nie
# lief.
#
# Seit 2026-09-05 zusaetzlich als eigener Job: `ui:smoke` (siehe unten).
#
# Bewusst NICHT hier: electron-builder (`npm run dist`) — das gehoert zu
# release.yml und braucht Signatur-Material. Ebenso `test:drag`: der braucht
# wirklich einen laufenden Renderer (`dev:renderer`).
#
# Korrektur an derselben Begruendung: sie zaehlte `ui:smoke` mit auf, und das
# war falsch. `ui:smoke` startet die GEBAUTE App (`electron .` gegen `dist/`),
# nicht den Dev-Server. Nachgemessen 2026-09-05: unter `xvfb-run` mit
# installiertem `libsecret-1-0` laeuft er durch. Eine Begruendung, die zwei
# Laeufe zusammenfasst, von denen nur einer sie traegt, haelt den anderen
# jahrelang aus der CI heraus.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Ein zweiter Push auf denselben Branch bricht den vorigen Lauf ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      # keytar (native) braucht beim Kompilieren libsecret; Prebuilds decken
      # nicht jede Node-ABI ab. Gleiche Absicherung wie in pages.yml.
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - run: npm ci
      - name: Type-Check (Renderer)
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Lint
        run: npm run lint
      # Quellsprache (E-17/E-20): dieses Repo ist deutsch-quellig, und das
      # steht nicht nur da, es wird gemessen. Laeuft eigenstaendig neben
      # `npm test`, weil die Ausgabe die abweichenden Zeilen NAMENTLICH nennt
      # — in einem roten Vitest-Lauf ginge das unter.
      - name: Quellsprache
        run: npm run lang:check
      - name: Tests
        run: npm test
      - name: CRDT-Konvergenz
        run: npm run test:crdt
      - name: Signaling-Relay
        run: npm run test:signaling
      - name: Build
        run: npm run build
      # Fragt die action.yml jedes Pins nach ihrer Node-Version, statt sie in
      # einem Kommentar zu behaupten. Am 2026-09-05 liefen fuenf Actions auf
      # node20 -- und die Kommentare im Workflow gaben dazu einen Stand von Mai
      # wieder, der laengst nicht mehr galt. Der Lauf folgt eine Ebene in
      # Composite-Actions hinein: upload-pages-artifact@v3 hatte node20 nur im
      # Inneren, von aussen sah der Pin sauber aus.
      - name: Actions laufen auf einer unterstuetzten Node-Version
        run: npm run actions:check

  # ---------------------------------------------------------------------------
  # UI-Smoke: startet die gebaute Electron-App headless, oeffnet jedes Top-Menu
  # und meldet ein Menu ohne Eintraege. Mit genau diesem Harness wurde #549
  # gefunden -- und danach lief er bei keinem Merge mehr, weil er in der
  # CI-Begruendung faelschlich mit `test:drag` in einen Topf geworfen war.
  #
  # Eigener Job, weil er `npm run build` und einen X-Server braucht: so
  # verlaengert er den Merge-Gate nicht, sondern laeuft daneben.
  #
  # Warum `libsecret-1-0` (Laufzeit) UND `libsecret-1-dev` (Kompilieren):
  # gemessen bricht der Main-Prozess sonst beim `require('keytar')` mit
  # "libsecret-1.so.0: cannot open shared object file" ab, bevor ein Fenster
  # entsteht -- der Smoke-Lauf meldete dann nur einen 30-Sekunden-Timeout ohne
  # Ursache.
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libsecret-1-0 xvfb
      - run: npm ci
      - name: Build
        run: npm run build
      - name: UI-Smoke (headless)
        run: xvfb-run -a npm run ui:smoke
      # Im SELBEN Job wie der Smoke-Lauf, weil beide dasselbe teuer Gebaute
      # brauchen: `npm ci`, `npm run build` und ein X-Server. Ein eigener Job
      # haette das dreimal bezahlt, um dieselbe App zweimal zu starten.
      #
      # Was er findet, findet sonst niemand: `vitest` rendert nicht und kennt
      # keine Schriftbreiten, der Smoke-Lauf prueft nur, dass Menues aufgehen.
      # Ein Register, das aus seinem Panel faellt, war damit unsichtbar --
      # gemeldet hat es am 2026-09-07 ein Mensch, nicht die Pruefung.
      - name: Nichts abgeschnitten, nichts verdeckt
        run: xvfb-run -a npm run ui:overflow
      # Dritter Lauf im selben Job, aus demselben Grund: dieselbe gebaute App.
      # Er zaehlt, was der Nutzer am 2026-09-07 beschrieben hat -- „man erkennt
      # nicht auf den ersten Blick, was jedes Element verursacht": Knoepfe ohne
      # Namen (heute null) und Knoepfe, die nur ein Symbol tragen (heute sechs,
      # vorher 32). Die Zahl ist gedeckelt, damit sie nicht still zurueckwaechst.
      - name: Jedes Bedienelement hat einen Namen
        run: xvfb-run -a npm run ui:labels
      # Vierter Lauf im selben Job, wieder aus demselben Grund: dieselbe
      # gebaute App und derselbe X-Server. Er beantwortet die Frage, die
      # B-44 Teil 2 ausdruecklich OFFEN gelassen hat -- „wie viele
      # Bedienelemente liegen unter der 44-px-Marke?" -- und zwar am
      # gerenderten Element statt an Klassennamen. Gemessen sind es 89 von
      # 93; die Zahl ist gedeckelt, damit sie nicht still weiterwaechst.
      #
      # Der Lauf misst ZWEIMAL: einmal mit Maus, einmal mit nachgebildetem
      # Finger (`pointer: coarse`). Nur der zweite sieht die Griffe, die es
      # allein fuer den groben Zeiger gibt.
      - name: Trefferflaechen sind gross genug fuer einen Finger
        run: xvfb-run -a npm run ui:targets
      # Fuenfter Lauf im selben Job, wieder aus demselben Grund: dieselbe
      # gebaute Seite (`dist/renderer`). Er braucht KEINEN X-Server -- er
      # startet ein eigenes Chromium headless in einem 390x844 grossen
      # Fenster mit Fingerbedienung und misst, was ein Mensch am 2026-09-10
      # gemeldet hat: „Man kann das gesamte Fenster aus Versehen
      # verschieben." Die Elektron-Laeufe darueber sehen das nicht, weil sie
      # im Schreibtisch-Format messen; genau dort war der Fehler unsichtbar.
      #
      # Gerufen wird der npm-Lauf und nicht das Skript direkt: er baut den
      # Renderer vorher noch einmal. Das kostet drei Sekunden und macht den
      # Schritt hier identisch mit dem, was ein Mensch am eigenen Rechner
      # tippt -- ein Lauf, der in CI anders heisst als daheim, wird daheim
      # nicht gefahren.
      - name: Die App bleibt auf dem Telefon im Fenster
        run: npm run mobil:check
      - name: Screenshots bei Fehlschlag
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-smoke-screenshots
          path: /tmp/cable-planner-ui-shots
          if-no-files-found: ignore
